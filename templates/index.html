<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Files</title>
  </head>
  <body>
    <h1>Available Text Files</h1>
    <ul>
      {% for file in files %}
      <li><a href="/view/{{ file }}">{{ file }}</a></li>
      {% endfor %}
    </ul>
    <a href="{{ url_for('logout') }}">Logout</a>
  </body>
</html>
